<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Álbum Digital - Light Sound</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; color: #fff; font-family: 'Montserrat', sans-serif; padding: 20px 15px; }
        header { text-align: center; margin-bottom: 25px; }
        header h1 { font-family: 'Playfair Display', serif; font-size: 2.2rem; color: #ff4081; }
        header p { color: #888; font-size: 0.9rem; margin-top: 4px; }

        .actions-bar { display: flex; justify-content: center; margin-bottom: 30px; }
        .btn-download-all {
            background: linear-gradient(135deg, #ff0000, #b30000);
            color: #fff;
            padding: 12px 26px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.4);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 22px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .memory-card {
            background: #141414;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid #222;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            position: relative;
        }

        .media-container {
            position: relative;
            width: 100%;
            height: 260px;
            background: #000;
        }

        .media-container img, .media-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .btn-download-media {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid #ff0000;
            color: #fff;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            font-size: 0.9rem;
            backdrop-filter: blur(4px);
        }
        
        .memory-body {
            padding: 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .memory-author { font-weight: 700; color: #ff4081; margin-bottom: 6px; font-size: 1.1rem; }
        .memory-msg { font-style: italic; color: #ddd; margin-bottom: 12px; font-size: 0.95rem; line-height: 1.4; }

        .audio-section {
            margin-top: 10px;
            background: #1c1c1c;
            border-radius: 10px;
            padding: 8px 12px;
            border: 1px solid #333;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        audio { flex: 1; height: 36px; outline: none; }
        .btn-download-audio {
            background: #2a2a2a; border: 1px solid #444; color: #00d2d3;
            width: 36px; height: 36px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            text-decoration: none; font-size: 0.85rem; flex-shrink: 0;
        }

        .memory-time { font-size: 0.75rem; color: #666; margin-top: 12px; text-align: right; }
    </style>
</head>
<body>
    <header>
        <h1>Álbum de Recuerdos ✨</h1>
        <p>Libro de Visitas Digital • Light Sound</p>
    </header>

    <div class="actions-bar">
        <a href="/api/download-album" class="btn-download-all">
            <i class="fas fa-file-zipper"></i> Descargar Todo el Álbum (.ZIP)
        </a>
    </div>

    <div class="gallery-grid" id="grid"></div>

    <script>
        async function loadAlbum() {
            const grid = document.getElementById('grid');
            try {
                const res = await fetch('/api/album');
                const data = await res.json();

                if (!data || !data.length) {
                    grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:#777; margin-top: 40px;">Aún no hay recuerdos guardados.</p>';
                    return;
                }

                grid.innerHTML = data.map(item => {
                    let mediaMarkup = '';
                    
                    // Si es Video
                    if (item.videoUrl) {
                        mediaMarkup = `
                            <div class="media-container">
                                <video controls preload="metadata" playsinline webkit-playsinline src="${item.videoUrl}"></video>
                                <a href="${item.videoUrl}" download class="btn-download-media" title="Descargar Video">
                                    <i class="fas fa-download"></i>
                                </a>
                            </div>
                        `;
                    }
                    // Si es Foto
                    else if (item.photoUrl) {
                        mediaMarkup = `
                            <div class="media-container">
                                <img src="${item.photoUrl}" alt="Foto de ${item.author}">
                                <a href="${item.photoUrl}" download class="btn-download-media" title="Descargar Foto">
                                    <i class="fas fa-download"></i>
                                </a>
                            </div>
                        `;
                    }

                    let audioMarkup = '';
                    if (item.audioUrl) {
                        const isMp4 = item.audioUrl.endsWith('.mp4');
                        const mimeType = isMp4 ? 'audio/mp4' : 'audio/webm';
                        audioMarkup = `
                            <div class="audio-section">
                                <audio controls preload="metadata" playsinline webkit-playsinline>
                                    <source src="${item.audioUrl}" type="${mimeType}">
                                </audio>
                                <a href="${item.audioUrl}" download class="btn-download-audio" title="Descargar Audio">
                                    <i class="fas fa-arrow-down"></i>
                                </a>
                            </div>
                        `;
                    }

                    return `
                        <div class="memory-card">
                            ${mediaMarkup}
                            <div class="memory-body">
                                <div>
                                    <div class="memory-author">${item.author}</div>
                                    ${item.message ? `<div class="memory-msg">“${item.message}”</div>` : ''}
                                    ${audioMarkup}
                                </div>
                                <div class="memory-time">${item.timestamp}</div>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (err) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:#ff4757;">Error al cargar el álbum.</p>';
            }
        }
        loadAlbum();
    </script>
</body>
</html>
