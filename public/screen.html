<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyección en Vivo - Light Sound</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Barra Superior */
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 90px;
            padding: 0 40px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            z-index: 20;
            background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, transparent 100%);
        }

        .event-title {
            font-family: 'Playfair Display';
            font-size: 2.2rem;
            color: #ff0000;
            text-shadow: 0 2px 10px rgba(255, 68, 68, 0.5);
        }

        /* Logo Centrado en la parte superior */
        .brand-logo-center {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            height: 50px;
            object-fit: contain;
            filter: drop-shadow(0 0 12px rgba(255, 0, 0, 0.45));
        }

        /* Escenario de Proyección */
        .stage {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 95px 40px 45px 40px;
        }

        .photo-card {
            position: relative;
            max-width: 90vw;
            max-height: calc(100vh - 130px);
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: popIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .photo-card img {
            max-width: 85vw;
            max-height: calc(100vh - 200px);
            object-fit: contain;
            border-radius: 12px;
            border: 4px solid #fff;
            box-shadow: 0 0 50px rgba(255, 0, 0, 0.35);
            background: #111;
        }

        .text-only-card {
            background: #111;
            border: 3px solid #ff0000;
            padding: 35px 45px;
            border-radius: 20px;
            max-width: 75vw;
            text-align: center;
            box-shadow: 0 0 50px rgba(255, 0, 0, 0.35);
            animation: popIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .text-only-card p {
            font-size: 2.2rem;
            font-style: italic;
            line-height: 1.4;
            color: #fff;
        }

        .author-badge {
            margin-top: 10px;
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #ff0000;
            padding: 8px 26px;
            border-radius: 50px;
            font-size: 1.3rem;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }

        .message-sub {
            font-size: 1.1rem;
            color: #f1f1f1;
            margin-top: 6px;
            max-width: 80vw;
            text-align: center;
            background: rgba(0,0,0,0.75);
            padding: 6px 16px;
            border-radius: 8px;
            font-style: italic;
        }

        /* Insignia para Audios Dejados */
        .audio-notice-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            background: linear-gradient(90deg, #1e3c72, #2a5298);
            border: 1px solid #00d2d3;
            color: #fff;
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 600;
            box-shadow: 0 2px 10px rgba(0, 210, 211, 0.4);
            animation: pulseNotice 2s infinite alternate;
        }

        @keyframes pulseNotice {
            from { transform: scale(0.98); }
            to { transform: scale(1.02); }
        }

        /* Panel QR Inferior Izquierdo */
        .qr-overlay {
            position: absolute;
            bottom: 25px;
            left: 25px;
            background: rgba(17, 17, 17, 0.9);
            border: 2px solid #ff0000;
            border-radius: 14px;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 30;
            box-shadow: 0 8px 30px rgba(0,0,0,0.9);
        }

        .qr-text strong {
            display: block;
            font-size: 0.9rem;
            color: #ff0000;
        }

        .qr-text span {
            font-size: 0.65rem;
            color: #aaa;
            text-transform: uppercase;
        }

        @keyframes popIn {
            0% { transform: scale(0.92); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .emoji-blast {
            position: absolute;
            bottom: -50px;
            font-size: 4rem;
            pointer-events: none;
            z-index: 40;
            animation: riseUp 2.8s ease-in forwards;
        }

        @keyframes riseUp {
            0% { transform: translateY(0) scale(0.7); opacity: 1; }
            100% { transform: translateY(-115vh) scale(1.6); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Barra con Título y Logo Centrado -->
    <div class="top-bar">
        <div class="event-title">EVENTO</div>
        <img src="/logo_lightsound.png" alt="Light Sound" class="brand-logo-center" onerror="this.style.display='none'">
    </div>

    <!-- Escenario Principal -->
    <div class="stage" id="stage">
        <div class="photo-card" id="cardBox">
            <img id="mainImg" src="https://placehold.co/1200x800/111/fff?text=Esperando+recuerdos..." alt="Proyección">
            <div class="author-badge" id="mainAuthor">¡Escanea el QR para participar!</div>
        </div>
    </div>

    <!-- Panel QR -->
    <div class="qr-overlay">
        <div id="qrcode"></div>
        <div class="qr-text">
            <span>Fotos • Audios • Mensajes</span>
            <strong>ESCANEA AQUÍ</strong>
        </div>
    </div>

    <script>
        const socket = io();

        // Generar QR dinámico
        new QRCode(document.getElementById("qrcode"), {
            text: `${window.location.origin}/upload.html`,
            width: 80,
            height: 80,
            colorDark: "#ffffff",
            colorLight: "#111111"
        });

        // Manejador de nuevo contenido en tiempo real
        socket.on('new_content', (data) => {
            const stage = document.getElementById('stage');
            stage.innerHTML = '';

            const card = document.createElement('div');

            // Caso 1: Trae Foto
            if (data.photoUrl) {
                card.className = 'photo-card';
                const img = document.createElement('img');
                img.src = data.photoUrl;
                card.appendChild(img);

                const author = document.createElement('div');
                author.className = 'author-badge';
                author.textContent = data.author;
                card.appendChild(author);

                if (data.message) {
                    const msg = document.createElement('div');
                    msg.className = 'message-sub';
                    msg.textContent = `“${data.message}”`;
                    card.appendChild(msg);
                }
            } 
            // Caso 2: Solo Texto y/o Audio (Sin Foto)
            else {
                card.className = 'text-only-card';
                if (data.message) {
                    const p = document.createElement('p');
                    p.textContent = `“${data.message}”`;
                    card.appendChild(p);
                }
                const author = document.createElement('div');
                author.className = 'author-badge';
                author.style.marginTop = '18px';
                author.textContent = data.author;
                card.appendChild(author);
            }

            // Leyenda si el invitado grabó un audio
            if (data.audioUrl) {
                const audioBadge = document.createElement('div');
                audioBadge.className = 'audio-notice-badge';
                audioBadge.innerHTML = '🎙️ ¡Dejó un mensaje de voz! Escúchalo en el álbum digital';
                card.appendChild(audioBadge);
            }

            stage.appendChild(card);
        });

        // Reacciones con emojis en pantalla
        socket.on('show_reaction', (emoji) => {
            const el = document.createElement('div');
            el.className = 'emoji-blast';
            el.textContent = emoji;
            el.style.left = `${Math.random() * 75 + 10}vw`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 2800);
        });
    </script>
</body>
</html>
