<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyección en Vivo - LightSound</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
            perspective: 1200px;
        }

        /* Destello luminoso al cambiar contenido */
        .stage-flash {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, rgba(255, 0, 0, 0.5) 0%, rgba(255, 255, 255, 0.25) 30%, transparent 70%);
            pointer-events: none;
            z-index: 50;
            opacity: 0;
            mix-blend-mode: screen;
        }

        .flash-active {
            animation: immersiveFlash 0.75s ease-out forwards;
        }

        @keyframes immersiveFlash {
            0% { opacity: 0; transform: scale(0.6); }
            30% { opacity: 1; transform: scale(1.15); }
            100% { opacity: 0; transform: scale(1.4); }
        }

        /* Barra Superior */
        .top-bar {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 90px;
            padding: 0 40px;
            display: flex; align-items: center; justify-content: flex-start;
            z-index: 20;
            background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, transparent 100%);
        }

        .event-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.2rem;
            color: #ff0000;
            text-shadow: 0 2px 10px rgba(255, 0, 0, 0.5);
        }

        .brand-logo-center {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            height: 52px;
            object-fit: contain;
            filter: drop-shadow(0 0 14px rgba(255, 0, 0, 0.5));
        }

        .queue-status-panel {
            position: absolute;
            top: 20px;
            right: 35px;
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 30;
        }

        .timer-circle {
            background: rgba(17, 17, 17, 0.85);
            border: 2px solid #ff0000;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: none;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            font-weight: 900;
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
        }

        .queue-badge {
            background: rgba(20, 20, 20, 0.85);
            border: 1px solid #444;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #00d2d3;
            display: none;
        }

        /* ================= PANELES LATERALES QR GRANDES ================= */
        .side-panel {
            position: absolute;
            top: 52%;
            transform: translateY(-50%);
            background: rgba(15, 15, 15, 0.92);
            border-radius: 20px;
            padding: 16px 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            z-index: 30;
            width: 175px;
            backdrop-filter: blur(8px);
        }

        /* Lateral Izquierdo: Subir Recuerdos (Borde Rojo/Neón) */
        .panel-upload {
            left: 25px;
            border: 2px solid #ff0000;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.35);
        }

        /* Lateral Derecho: Instagram Light Sound (Borde Gradiente Morado/Rosa) */
        .panel-instagram {
            right: 25px;
            border: 2px solid #ff0000;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.5);
        }

        .side-panel .panel-tag {
            font-size: 0.7rem;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .panel-upload .panel-tag { color: #ff0000; }
        .panel-instagram .panel-tag { color: #ff0000; }

        .side-panel .qr-container {
            background: #fff;
            padding: 8px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }

        .side-panel .panel-desc {
            font-size: 0.78rem;
            margin-top: 10px;
            line-height: 1.3;
            color: #eee;
        }

        .panel-desc strong {
            display: block;
            margin-top: 4px;
            font-size: 0.82rem;
        }

        .panel-upload .panel-desc strong { color: #00d2d3; }
        .panel-instagram .panel-desc strong { color: #ff0000; }

        /* Escenario Central */
        .stage {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 95px 215px 45px 215px; /* Espacio reservado para los QR laterales */
        }

        .media-card {
            position: relative;
            max-width: 68vw;
            max-height: calc(100vh - 130px);
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: immersivePopIn 0.8s cubic-bezier(0.19, 1, 0.22, 1) forwards;
            transform-origin: center center;
        }

        .media-card img, .media-card video {
            max-width: 65vw;
            max-height: calc(100vh - 200px);
            object-fit: contain;
            border-radius: 14px;
            border: 3px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 60px rgba(255, 0, 0, 0.5), 0 0 120px rgba(255, 0, 50, 0.2);
            background: #111;
        }

        .text-only-card {
            background: rgba(17, 17, 17, 0.95);
            border: 2px solid #ff0000;
            padding: 40px 50px;
            border-radius: 24px;
            max-width: 65vw;
            text-align: center;
            box-shadow: 0 0 60px rgba(255, 0, 50, 0.45);
            animation: immersivePopIn 0.8s cubic-bezier(0.19, 1, 0.22, 1) forwards;
        }

        .text-only-card p {
            font-size: 2.1rem;
            font-style: italic;
            line-height: 1.4;
            color: #fff;
        }

        .author-badge {
            margin-top: 12px;
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #ff0000;
            padding: 8px 28px;
            border-radius: 50px;
            font-size: 1.35rem;
            font-weight: 700;
            box-shadow: 0 4px 20px rgba(0,0,0,0.9);
            animation: elementFloat 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.15s both;
        }

        .message-sub {
            font-size: 1.15rem;
            color: #f1f1f1;
            margin-top: 8px;
            max-width: 65vw;
            text-align: center;
            background: rgba(0,0,0,0.8);
            padding: 8px 20px;
            border-radius: 10px;
            font-style: italic;
            animation: elementFloat 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.25s both;
        }

        .audio-notice-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            background: linear-gradient(90deg, #1e3c72, #2a5298);
            border: 1px solid #00d2d3;
            color: #fff;
            padding: 7px 20px;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 600;
            box-shadow: 0 0 15px rgba(0, 210, 211, 0.5);
            animation: elementFloat 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.35s both;
        }

        /* Animaciones */
        @keyframes immersivePopIn {
            0% { opacity: 0; transform: scale(0.72) translateZ(-150px) rotateX(8deg); filter: blur(12px) brightness(1.8); }
            70% { opacity: 1; transform: scale(1.02) translateZ(20px) rotateX(-1deg); filter: blur(0px) brightness(1.1); }
            100% { opacity: 1; transform: scale(1) translateZ(0) rotateX(0deg); filter: blur(0px) brightness(1); }
        }

        @keyframes elementFloat {
            0% { opacity: 0; transform: translateY(25px) scale(0.9); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .emoji-blast {
            position: absolute; bottom: -50px; font-size: 4rem; pointer-events: none; z-index: 40;
            animation: riseUp 2.8s ease-in forwards;
        }
        @keyframes riseUp {
            0% { transform: translateY(0) scale(0.7); opacity: 1; }
            100% { transform: translateY(-115vh) scale(1.6); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="stage-flash" id="flashFx"></div>

    <!-- Barra Superior con Logo Centrado -->
    <div class="top-bar">
        <div class="event-title">EVENTO</div>
        <img src="/logo_lightsound.jpg" alt="Light Sound" class="brand-logo-center">
        
        <div class="queue-status-panel">
            <div class="queue-badge" id="queueBadge">En espera: 0</div>
            <div class="timer-circle" id="timerCircle">30</div>
        </div>
    </div>

    <!-- QR Lateral Izquierdo (Subida / Participación) -->
    <div class="side-panel panel-upload">
        <div class="panel-tag"><i class="fas fa-camera"></i> Participa</div>
        <div class="qr-container">
            <div id="qrUpload"></div>
        </div>
        <div class="panel-desc">
            Escanea y sube tu foto o video
            <strong>¡EN VIVO!</strong>
        </div>
    </div>

    <!-- QR Lateral Derecho (Instagram Light Sound) -->
    <div class="side-panel panel-instagram">
        <div class="panel-tag"><i class="fab fa-instagram"></i> Síguenos</div>
        <div class="qr-container">
            <div id="qrInstagram"></div>
        </div>
        <div class="panel-desc">
            Todo el contenido estará publicado en:
            <strong>@lightsoundprofessionalteam</strong>
        </div>
    </div>

    <!-- Escenario Central -->
    <div class="stage" id="stage">
        <div class="media-card" id="cardBox">
            <img id="mainImg" src="https://placehold.co/1200x800/111/fff?text=Esperando+recuerdos..." alt="Proyección">
            <div class="author-badge" id="mainAuthor">¡Escanea el QR para participar!</div>
        </div>
    </div>

    <script>
        const socket = io();

        // 1. Generar QR de Subida (Izquierdo) en tamaño grande (135x135)
        new QRCode(document.getElementById("qrUpload"), {
            text: `${window.location.origin}/upload.html`,
            width: 135,
            height: 135,
            colorDark: "#000000",
            colorLight: "#ffffff"
        });

        // 2. Generar QR de Instagram (Derecho) en tamaño grande (135x135)
        new QRCode(document.getElementById("qrInstagram"), {
            text: "https://www.instagram.com/lightsoundprofessionalteam/?hl=es",
            width: 135,
            height: 135,
            colorDark: "#000000",
            colorLight: "#ffffff"
        });

        const queue = [];
        let isPresenting = false;
        let isLoopingAlone = false;
        let countdownInterval = null;

        function triggerFlashEffect() {
            const flash = document.getElementById('flashFx');
            flash.classList.remove('flash-active');
            void flash.offsetWidth;
            flash.classList.add('flash-active');
        }

        socket.on('new_content', (data) => {
            queue.push(data);
            updateQueueStatus();
            
            if (isLoopingAlone) {
                isLoopingAlone = false;
                if (countdownInterval) clearInterval(countdownInterval);
                processNextInQueue();
            } else if (!isPresenting) {
                processNextInQueue();
            }
        });

        function updateQueueStatus() {
            const badge = document.getElementById('queueBadge');
            if (queue.length > 0) {
                badge.style.display = 'block';
                badge.textContent = `En espera: ${queue.length}`;
            } else {
                badge.style.display = 'none';
            }
        }

        function processNextInQueue() {
            if (queue.length === 0) {
                isPresenting = false;
                isLoopingAlone = false;
                document.getElementById('timerCircle').style.display = 'none';
                return;
            }

            isPresenting = true;
            isLoopingAlone = false;
            const data = queue.shift();
            updateQueueStatus();
            triggerFlashEffect();

            const timerEl = document.getElementById('timerCircle');
            timerEl.style.display = 'flex';

            if (countdownInterval) clearInterval(countdownInterval);

            // Caso 1: Video
            if (data.videoUrl) {
                renderVideoSlide(data, (exactDuration) => {
                    let duration = Math.min(Math.ceil(exactDuration) || 30, 30);
                    startCountdown(duration, () => {
                        if (queue.length > 0) {
                            processNextInQueue();
                        } else {
                            isLoopingAlone = true;
                            document.getElementById('timerCircle').style.display = 'none';
                        }
                    });
                });
            } 
            // Caso 2: Foto (30s)
            else if (data.photoUrl) {
                renderPhotoSlide(data);
                startCountdown(30, () => {
                    if (queue.length > 0) {
                        processNextInQueue();
                    } else {
                        document.getElementById('timerCircle').style.display = 'none';
                        isPresenting = false;
                    }
                });
            } 
            // Caso 3: Solo Texto / Audio (15s)
            else {
                renderTextSlide(data);
                startCountdown(15, () => {
                    if (queue.length > 0) {
                        processNextInQueue();
                    } else {
                        document.getElementById('timerCircle').style.display = 'none';
                        isPresenting = false;
                    }
                });
            }
        }

        function startCountdown(seconds, onComplete) {
            let timeLeft = seconds;
            const timerEl = document.getElementById('timerCircle');
            timerEl.textContent = timeLeft;

            countdownInterval = setInterval(() => {
                timeLeft--;
                timerEl.textContent = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(countdownInterval);
                    onComplete();
                }
            }, 1000);
        }

        function renderVideoSlide(data, onReadyDuration) {
            const stage = document.getElementById('stage');
            stage.innerHTML = '';

            const card = document.createElement('div');
            card.className = 'media-card';

            const video = document.createElement('video');
            video.src = data.videoUrl;
            video.preload = 'auto';
            video.autoplay = true;
            video.loop = true;
            video.playsInline = true;
            video.muted = true;

            let durationDispatched = false;

            video.oncanplay = () => {
                video.play().catch(() => {});
                if (!durationDispatched && video.duration) {
                    durationDispatched = true;
                    onReadyDuration(video.duration);
                }
            };

            setTimeout(() => {
                if (!durationDispatched) {
                    durationDispatched = true;
                    onReadyDuration(video.duration || 30);
                }
            }, 800);

            card.appendChild(video);

            const author = document.createElement('div');
            author.className = 'author-badge';
            author.textContent = data.author;
            card.appendChild(author);

            appendAudioBadge(data, card);
            stage.appendChild(card);
        }

        function renderPhotoSlide(data) {
            const stage = document.getElementById('stage');
            stage.innerHTML = '';

            const card = document.createElement('div');
            card.className = 'media-card';

            const img = document.createElement('img');
            img.src = data.photoUrl;
            card.appendChild(img);

            const author = document.createElement('div');
            author.className = 'author-badge';
            author.textContent = data.author;
            card.appendChild(author);

            if (data.message) {
                const msg = document.createElement('div');
                msg.className = 'message-sub';
                msg.textContent = `“${data.message}”`;
                card.appendChild(msg);
            }

            appendAudioBadge(data, card);
            stage.appendChild(card);
        }

        function renderTextSlide(data) {
            const stage = document.getElementById('stage');
            stage.innerHTML = '';

            const card = document.createElement('div');
            card.className = 'text-only-card';

            if (data.message) {
                const p = document.createElement('p');
                p.textContent = `“${data.message}”`;
                card.appendChild(p);
            }

            const author = document.createElement('div');
            author.className = 'author-badge';
            author.style.marginTop = '18px';
            author.textContent = data.author;
            card.appendChild(author);

            appendAudioBadge(data, card);
            stage.appendChild(card);
        }

        function appendAudioBadge(data, container) {
            if (data.audioUrl) {
                const audioBadge = document.createElement('div');
                audioBadge.className = 'audio-notice-badge';
                audioBadge.innerHTML = '🎙️ ¡Dejó un mensaje de voz! Escúchalo en el álbum digital';
                container.appendChild(audioBadge);
            }
        }

        socket.on('show_reaction', (emoji) => {
            const el = document.createElement('div');
            el.className = 'emoji-blast';
            el.textContent = emoji;
            el.style.left = `${Math.random() * 50 + 25}vw`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 2800);
        });
    </script>
</body>
</html>
