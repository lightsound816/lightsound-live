<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Light Sound - Enviar Recuerdo</title>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-deep: #0a0a0a;
            --control-bg: #141414;
            --brand-red: #ff0000;
            --text-main: #ffffff;
            --valentina-title: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            min-height: 100vh;
        }

        header {
            margin-bottom: 20px;
            width: 100%;
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.9rem;
            color: var(--valentina-title);
            margin-bottom: 4px;
        }

        header p {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--brand-red);
            font-weight: 700;
            letter-spacing: 1px;
        }

        .upload-card {
            background-color: var(--control-bg);
            width: 100%;
            max-width: 480px;
            border-radius: 14px;
            padding: 22px;
            border: 1px solid #222;
            border-bottom: 4px solid var(--brand-red);
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 14px;
            background-color: #000;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
            font-family: inherit;
            margin-bottom: 15px;
            outline: none;
        }

        textarea {
            resize: none;
            height: 75px;
        }

        input[type="text"]:focus, textarea:focus {
            border-color: #555;
        }

        .btn-file {
            display: block;
            background-color: #222;
            color: #eee;
            border: 1px dashed #555;
            padding: 14px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            margin-bottom: 15px;
            transition: all 0.2s;
        }

        .btn-file.has-file {
            background-color: #1e3728;
            border-color: #2ecc71;
            color: #2ecc71;
        }

        input[type="file"] { display: none; }

        /* Contenedor de Grabación de Audio */
        .audio-recorder {
            background-color: #000;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .audio-status {
            font-size: 0.85rem;
            color: #aaa;
            text-align: left;
        }

        .btn-record {
            background-color: var(--brand-red);
            color: #fff;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s;
        }

        .btn-record.recording {
            animation: pulse-red 1.2s infinite;
            background-color: #ff3838;
        }

        @keyframes pulse-red {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 56, 56, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(255, 56, 56, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 56, 56, 0); }
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background-color: var(--brand-red);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: opacity 0.2s;
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .album-link {
            display: inline-block;
            margin-top: 18px;
            color: #888;
            font-size: 0.85rem;
            text-decoration: underline;
        }

        /* Panel de Reacciones */
        .reaction-panel {
            margin-top: 25px;
        }

        .reaction-panel h3 {
            font-size: 0.8rem;
            color: #777;
            text-transform: uppercase;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .reactions {
            display: flex;
            justify-content: center;
            gap: 14px;
        }

        .reactions button {
            font-size: 1.7rem;
            background-color: var(--control-bg);
            border: 1px solid #282828;
            border-radius: 50%;
            width: 55px;
            height: 55px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.1s;
        }

        .reactions button:active {
            transform: scale(0.9);
        }

        /* Footer y Contacto */
        footer {
            margin-top: auto;
            width: 100%;
            border-top: 1px solid #1a1a1a;
            padding-top: 20px;
            padding-bottom: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        footer img {
            height: 26px;
            object-fit: contain;
        }

        .social-links {
            display: flex;
            gap: 20px;
            font-size: 1.4rem;
        }

        .social-links a {
            color: #888;
            text-decoration: none;
            transition: color 0.2s;
        }

        .social-links a:hover {
            color: var(--brand-red);
        }

        .company-contact {
            font-size: 0.75rem;
            color: #555;
        }
    </style>
</head>
<body>

    <header>
        <h1>Valentina XV</h1>
        <p>Dejar Recuerdo en Pantalla</p>
    </header>

    <div class="upload-card">
        <input type="text" id="name" placeholder="Tu Nombre / Familia" required>
        <textarea id="message" placeholder="Escribe un mensaje o felicitación..."></textarea>
        
        <label class="btn-file" for="photo" id="lblFile">📷 Adjuntar Foto</label>
        <input type="file" id="photo" accept="image/*" capture="environment">

        <!-- Grabadora iOS / Android -->
        <div class="audio-recorder">
            <span class="audio-status" id="audioStatus">Grabar nota de voz</span>
            <button type="button" class="btn-record" id="recordBtn" onclick="toggleRecord()">
                <i class="fas fa-microphone"></i>
            </button>
        </div>

        <button class="btn-submit" id="btnSend" onclick="enviarRecuerdo()">¡Proyectar y Guardar!</button>
        <a href="/album.html" class="album-link">📖 Ver Álbum Digital del Evento</a>
    </div>

    <!-- Reacciones Rápidas -->
    <div class="reaction-panel">
        <h3>Reacciona en vivo</h3>
        <div class="reactions">
            <button onclick="reaccionar('🔥')">🔥</button>
            <button onclick="reaccionar('❤️')">❤️</button>
            <button onclick="reaccionar('🎉')">🎉</button>
            <button onclick="reaccionar('✨')">✨</button>
        </div>
    </div>

    <!-- Redes y Marca Light Sound -->
    <footer>
        <img src="/logo_lightsound.png" alt="Light Sound" onerror="this.style.display='none'">
        <div class="social-links">
            <a href="https://www.instagram.com/lightsoundprofessionalteam/" target="_blank">
                <i class="fab fa-instagram"></i>
            </a>
            <a href="https://wa.me/526622885556?text=Hola%20Light%20Sound,%20quiero%20información" target="_blank">
                <i class="fab fa-whatsapp"></i>
            </a>
        </div>
        <p class="company-contact">Light Sound Professional Team | Wh: 662-288-5556</p>
    </footer>

    <script>
        const socket = io();
        const inputPhoto = document.getElementById('photo');
        const lblFile = document.getElementById('lblFile');
        const btnSend = document.getElementById('btnSend');

        let mediaRecorder;
        let audioChunks = [];
        let recordedBlob = null;
        let recordedExt = 'mp4';
        let mimeType = '';

        // UX Selector de Foto
        inputPhoto.addEventListener('change', () => {
            if (inputPhoto.files.length) {
                lblFile.textContent = '✅ Foto Seleccionada';
                lblFile.classList.add('has-file');
            }
        });

        // Grabadora con detección cruzada iOS / Android
        async function toggleRecord() {
            const btn = document.getElementById('recordBtn');
            const status = document.getElementById('audioStatus');

            if (!mediaRecorder || mediaRecorder.state === 'inactive') {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    
                    // Selección estricta de códec compatible
                    if (MediaRecorder.isTypeSupported('audio/mp4')) {
                        mimeType = 'audio/mp4';
                        recordedExt = 'mp4';
                    } else if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) {
                        mimeType = 'audio/webm;codecs=opus';
                        recordedExt = 'webm';
                    } else if (MediaRecorder.isTypeSupported('audio/webm')) {
                        mimeType = 'audio/webm';
                        recordedExt = 'webm';
                    } else {
                        mimeType = '';
                        recordedExt = 'mp4';
                    }

                    mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = (e) => {
                        if (e.data && e.data.size > 0) audioChunks.push(e.data);
                    };

                    mediaRecorder.onstop = () => {
                        recordedBlob = new Blob(audioChunks, { type: mimeType || 'audio/mp4' });
                        status.textContent = '✅ Audio Grabado Listo';
                        status.style.color = '#2ecc71';
                        // Detener pistas de audio para liberar el micrófono en iOS
                        stream.getTracks().forEach(track => track.stop());
                    };

                    mediaRecorder.start();
                    btn.classList.add('recording');
                    status.textContent = 'Grabando... (Toca para detener)';
                    status.style.color = '#ff3838';
                } catch (err) {
                    alert('Permiso de micrófono no otorgado. En iPhone ve a Ajustes > Safari > Micrófono y selecciona Permitir.');
                }
            } else if (mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                btn.classList.remove('recording');
            }
        }

        // Envío unificado al Servidor
        async function enviarRecuerdo() {
            const author = document.getElementById('name').value.trim();
            const message = document.getElementById('message').value.trim();
            const file = inputPhoto.files[0];

            if (!file && !message && !recordedBlob) {
                return alert('Por favor agrega una foto, un mensaje o un audio.');
            }

            const formData = new FormData();
            formData.append('author', author || 'Invitado');
            formData.append('message', message);
            
            if (file) formData.append('photo', file);
            if (recordedBlob) formData.append('audio', recordedBlob, `voice-${Date.now()}.${recordedExt}`);

            btnSend.disabled = true;
            btnSend.textContent = 'Enviando...';

            try {
                const res = await fetch('/api/upload', { method: 'POST', body: formData });
                if (res.ok) {
                    alert('¡Recuerdo enviado a pantalla y guardado en el álbum!');
                    location.reload();
                } else {
                    alert('Hubo un detalle al enviar el recuerdo.');
                    btnSend.disabled = false;
                    btnSend.textContent = '¡Proyectar y Guardar!';
                }
            } catch (err) {
                alert('Error de conexión con el servidor.');
                btnSend.disabled = false;
                btnSend.textContent = '¡Proyectar y Guardar!';
            }
        }

        function reaccionar(emoji) {
            socket.emit('send_reaction', emoji);
        }
    </script>
</body>
</html>
