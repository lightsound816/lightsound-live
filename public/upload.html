<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EVENTO - Dejar Recuerdo</title>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bg: #0a0a0a; --card: #161616; --red: #ff0000; --text: #fff; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Montserrat', sans-serif; padding: 20px; text-align: center; }
        header h1 { font-family: 'Playfair Display', serif; color: #fff; font-size: 1.8rem; }
        header p { color: var(--red); font-size: 0.8rem; font-weight: bold; margin-bottom: 15px; }

        .card { background: var(--card); border-radius: 12px; padding: 20px; border: 1px solid #222; border-bottom: 4px solid var(--red); margin-bottom: 20px; }
        input, textarea { width: 100%; padding: 12px; background: #000; border: 1px solid #333; border-radius: 6px; color: #fff; font-family: inherit; margin-bottom: 12px; }
        textarea { resize: none; height: 70px; }

        .file-btn { display: block; background: #222; border: 1px solid #444; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-bottom: 12px; }
        input[type="file"] { display: none; }

        /* Grabadora */
        .audio-box { background: #000; padding: 12px; border-radius: 8px; margin-bottom: 15px; display: flex; align-items: center; justify-content: space-around; border: 1px solid #333; }
        .record-btn { background: var(--red); color: #fff; border: none; width: 45px; height: 45px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; }
        .record-btn.recording { animation: pulse 1s infinite alternate; background: #ff4757; }
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.15); } }

        .submit-btn { width: 100%; padding: 15px; background: var(--red); border: none; border-radius: 6px; color: #fff; font-weight: bold; font-size: 1rem; text-transform: uppercase; cursor: pointer; }
        .album-link { display: inline-block; margin-top: 15px; color: #aaa; text-decoration: underline; font-size: 0.9rem; }

        .reactions { display: flex; justify-content: center; gap: 12px; margin: 20px 0; }
        .reactions button { font-size: 1.6rem; background: var(--card); border: 1px solid #333; border-radius: 50%; width: 50px; height: 50px; cursor: pointer; }

       /* Pie de página y Redes Sociales de Light Sound */
        footer {
            margin-top: auto;
            width: 100%;
            border-top: 1px solid #222;
            padding-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        footer { margin-top: 25px; border-top: 1px solid #222; padding-top: 15px; }
        footer img { height: 25px; }
    </style>
</head>
<body>
    <header>
        <h1>EVENTO</h1>
        <p>Libro de Recuerdos y Proyección</p>
    </header>

    <div class="card">
        <input type="text" id="name" placeholder="Tu Nombre / Familia" required>
        <textarea id="message" placeholder="Escribe una dedicatoria o mensaje..."></textarea>
        
        <label class="file-btn" for="photo" id="lblPhoto">📷 Adjuntar Foto</label>
        <input type="file" id="photo" accept="image/*" capture="environment">

        <div class="audio-box">
            <span id="audioStatus" style="font-size: 0.85rem; color: #aaa;">Grabar Nota de Voz</span>
            <button type="button" class="record-btn" id="recordBtn" onclick="toggleRecord()"><i class="fas fa-microphone"></i></button>
        </div>

        <button class="submit-btn" id="btnSend" onclick="enviarRecuerdo()">Enviar Recuerdo</button>
        <a href="/album.html" class="album-link">📖 Ver Álbum Digital del Evento</a>
    </div>

    <div class="reactions">
        <button onclick="reaccionar('🔥')">🔥</button>
        <button onclick="reaccionar('❤️')">❤️</button>
        <button onclick="reaccionar('🎉')">🎉</button>
        <button onclick="reaccionar('✨')">✨</button>
    </div>

    <footer>
        <img src="/logo_lightsound.jpg" alt="Light Sound" onerror="this.style.display='none'">
        <div class="social-links">
            <!-- Instagram -->
            <a href="https://www.instagram.com/lightsoundprofessionalteam/" target="_blank">
                <i class="fab fa-instagram"></i>
            </a>
            <!-- WhatsApp (Formato API) -->
            <a href="https://wa.me/526622885556?text=Cotización%20Proyección%20Live" target="_blank">
                <i class="fab fa-whatsapp"></i>
            </a>
        </div>
        <p class="company-contact">Light Sound Professional Team | Wh: 662-288-5556</p>
    </footer>

    <script>
        const socket = io();
        const photoInput = document.getElementById('photo');
        let mediaRecorder;
        let audioChunks = [];
        let recordedBlob = null;

        photoInput.addEventListener('change', () => {
            if (photoInput.files.length) document.getElementById('lblPhoto').textContent = '✅ Foto Seleccionada';
        });

        // Lógica de grabación de audio nativa
        async function toggleRecord() {
            const btn = document.getElementById('recordBtn');
            const status = document.getElementById('audioStatus');

            if (!mediaRecorder || mediaRecorder.state === 'inactive') {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        recordedBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        status.textContent = '✅ Audio Listo';
                        status.style.color = '#2ecc71';
                    };

                    mediaRecorder.start();
                    btn.classList.add('recording');
                    status.textContent = 'Grabando... (Toca para parar)';
                    status.style.color = '#ff4757';
                } catch (err) {
                    alert('Permiso de micrófono denegado');
                }
            } else if (mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                btn.classList.remove('recording');
            }
        }

        async function enviarRecuerdo() {
            const author = document.getElementById('name').value.trim();
            const message = document.getElementById('message').value.trim();
            const file = photoInput.files[0];

            if (!file && !message && !recordedBlob) {
                return alert('Por favor agrega una foto, un mensaje o un audio.');
            }

            const formData = new FormData();
            formData.append('author', author || 'Invitado');
            formData.append('message', message);
            if (file) formData.append('photo', file);
            if (recordedBlob) formData.append('audio', recordedBlob, 'audio.webm');

            const btn = document.getElementById('btnSend');
            btn.disabled = true;
            btn.textContent = 'Guardando...';

            try {
                const res = await fetch('/api/upload', { method: 'POST', body: formData });
                if (res.ok) {
                    alert('¡Recuerdo guardado en el álbum!');
                    location.reload();
                }
            } catch (err) {
                alert('Error de conexión');
                btn.disabled = false;
                btn.textContent = 'Enviar Recuerdo';
            }
        }

        function reaccionar(emoji) { socket.emit('send_reaction', emoji); }
    </script>
</body>
</html>
