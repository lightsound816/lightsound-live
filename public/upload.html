<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LightSound - Enviar Recuerdo</title>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-deep: #0a0a0a;
            --control-bg: #141414;
            --brand-red: #ff0000;
            --text-main: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            min-height: 100vh;
        }

        header h1 { font-family: 'Montserrat', sans-serif; font-size: 1.9rem; margin-bottom: 4px; }
        header p { font-size: 0.75rem; text-transform: uppercase; color: var(--brand-red); font-weight: 700; letter-spacing: 1px; margin-bottom: 18px; }

        .upload-card {
            background-color: var(--control-bg);
            width: 100%;
            max-width: 480px;
            border-radius: 14px;
            padding: 22px;
            border: 1px solid #222;
            border-bottom: 4px solid var(--brand-red);
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 14px;
            background-color: #000;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-family: inherit;
            margin-bottom: 14px;
            outline: none;
        }
        textarea { resize: none; height: 70px; }

        .media-buttons-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 14px;
        }

        .btn-media {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background-color: #222;
            color: #eee;
            border: 1px dashed #555;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .btn-media.has-file {
            background-color: #1e3728;
            border-color: #2ecc71;
            color: #2ecc71;
        }

        input[type="file"] { display: none; }

        .audio-recorder {
            background-color: #000;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .btn-record {
            background-color: var(--brand-red);
            color: #fff;
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            font-size: 1.1rem;
            cursor: pointer;
        }

        .btn-record.recording {
            animation: pulse-red 1.2s infinite;
            background-color: #ff3838;
        }

        @keyframes pulse-red {
            0% { transform: scale(0.95); }
            70% { transform: scale(1.05); }
            100% { transform: scale(0.95); }
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background-color: var(--brand-red);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
        }

        .album-link { display: inline-block; margin-top: 18px; color: #888; font-size: 0.85rem; text-decoration: underline; }

        .reactions { display: flex; justify-content: center; gap: 14px; margin-top: 20px; }
        .reactions button { font-size: 1.7rem; background-color: var(--control-bg); border: 1px solid #282828; border-radius: 50%; width: 55px; height: 55px; cursor: pointer; }

        footer { margin-top: auto; border-top: 1px solid #1a1a1a; padding-top: 15px; }
        footer img { height: 26px; }
    </style>
</head>
<body>

    <header>
        <h1>EVENTO</h1>
        <p>Dejar Recuerdo en Pantalla</p>
    </header>

    <div class="upload-card">
        <input type="text" id="name" placeholder="Tu Nombre / Familia" required>
        <textarea id="message" placeholder="Escribe una dedicatoria..."></textarea>
        
        <!-- Botones de Subida de Foto y Grabación de Video -->
        <div class="media-buttons-grid">
            <label class="btn-media" for="photo" id="lblPhoto">
                <i class="fas fa-camera"></i> Foto
            </label>
            <input type="file" id="photo" accept="image/*" capture="environment">

            <label class="btn-media" for="video" id="lblVideo">
                <i class="fas fa-video"></i> Video (30s)
            </label>
            <input type="file" id="video" accept="video/*" capture="environment">
        </div>

        <!-- Grabadora de Audio -->
        <div class="audio-recorder">
            <span id="audioStatus" style="font-size: 0.85rem; color: #aaa;">Grabar nota de voz</span>
            <button type="button" class="btn-record" id="recordBtn" onclick="toggleRecord()">
                <i class="fas fa-microphone"></i>
            </button>
        </div>

        <button class="btn-submit" id="btnSend" onclick="enviarRecuerdo()">¡Proyectar y Guardar!</button>
        <a href="/album.html" class="album-link">📖 Ver Álbum Digital del Evento</a>
    </div>

    <div class="reactions">
        <button onclick="reaccionar('🔥')">🔥</button>
        <button onclick="reaccionar('❤️')">❤️</button>
        <button onclick="reaccionar('🎉')">🎉</button>
        <button onclick="reaccionar('✨')">✨</button>
    </div>

    <footer>
        <img src="/logo_lightsound.jpg" alt="LightSound" onerror="this.style.display='none'">
    </footer>

    <script>
        const socket = io();
        const inputPhoto = document.getElementById('photo');
        const inputVideo = document.getElementById('video');
        const lblPhoto = document.getElementById('lblPhoto');
        const lblVideo = document.getElementById('lblVideo');
        const btnSend = document.getElementById('btnSend');

        let mediaRecorder;
        let audioChunks = [];
        let recordedBlob = null;
        let recordedExt = 'mp4';

        // Manejo de Fotos
        inputPhoto.addEventListener('change', () => {
            if (inputPhoto.files.length) {
                lblPhoto.innerHTML = '<i class="fas fa-check"></i> Foto Lista';
                lblPhoto.classList.add('has-file');
                // Deseleccionar video si había
                inputVideo.value = '';
                lblVideo.innerHTML = '<i class="fas fa-video"></i> Video (30s)';
                lblVideo.classList.remove('has-file');
            }
        });

        // Manejo de Videos
        inputVideo.addEventListener('change', () => {
            if (inputVideo.files.length) {
                const file = inputVideo.files[0];
                lblVideo.innerHTML = '<i class="fas fa-check"></i> Video Listo';
                lblVideo.classList.add('has-file');
                // Deseleccionar foto si había
                inputPhoto.value = '';
                lblPhoto.innerHTML = '<i class="fas fa-camera"></i> Foto';
                lblPhoto.classList.remove('has-file');
            }
        });

        // Grabación de Audio
        async function toggleRecord() {
            const btn = document.getElementById('recordBtn');
            const status = document.getElementById('audioStatus');

            if (!mediaRecorder || mediaRecorder.state === 'inactive') {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    let mimeType = MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : 'audio/webm';
                    recordedExt = mimeType === 'audio/mp4' ? 'mp4' : 'webm';

                    mediaRecorder = new MediaRecorder(stream, { mimeType });
                    audioChunks = [];

                    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
                    mediaRecorder.onstop = () => {
                        recordedBlob = new Blob(audioChunks, { type: mimeType });
                        status.textContent = '✅ Audio Grabado';
                        status.style.color = '#2ecc71';
                        stream.getTracks().forEach(track => track.stop());
                    };

                    mediaRecorder.start();
                    btn.classList.add('recording');
                    status.textContent = 'Grabando...';
                    status.style.color = '#ff3838';
                } catch (err) {
                    alert('Permiso de micrófono no disponible.');
                }
            } else if (mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                btn.classList.remove('recording');
            }
        }

        async function enviarRecuerdo() {
            const author = document.getElementById('name').value.trim();
            const message = document.getElementById('message').value.trim();
            const photoFile = inputPhoto.files[0];
            const videoFile = inputVideo.files[0];

            if (!photoFile && !videoFile && !message && !recordedBlob) {
                return alert('Por favor selecciona una foto, video, mensaje o audio.');
            }

            const formData = new FormData();
            formData.append('author', author || 'Invitado');
            formData.append('message', message);
            
            if (photoFile) formData.append('photo', photoFile);
            if (videoFile) formData.append('video', videoFile);
            if (recordedBlob) formData.append('audio', recordedBlob, `voice-${Date.now()}.${recordedExt}`);

            btnSend.disabled = true;
            btnSend.textContent = 'Subiendo contenido...';

            try {
                const res = await fetch('/api/upload', { method: 'POST', body: formData });
                if (res.ok) {
                    alert('¡Recuerdo enviado a la fila de proyección y guardado en el álbum!');
                    location.reload();
                } else {
                    alert('Error al enviar el contenido.');
                    btnSend.disabled = false;
                    btnSend.textContent = '¡Proyectar y Guardar!';
                }
            } catch (err) {
                alert('Error de conexión.');
                btnSend.disabled = false;
                btnSend.textContent = '¡Proyectar y Guardar!';
            }
        }

        function reaccionar(emoji) { socket.emit('send_reaction', emoji); }
    </script>
</body>
</html>
